<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Point-of-care grading and management of CRS and ICANS from bispecific T-cell engagers.">
<meta name="theme-color" content="#0A5A78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BsAb TOX">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>BsAb TOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: point-of-care tool. Deep-teal header band with an antibody mark, overlapping action cards, icon tiles (CARTOX-style big targets), one-column clinical cards, grade-coloured result bands. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#12202A; --muted:#566874; --line:#DAE2E8;
  --hdr:#0B4F69; --hdr-2:#0E6A86; --hdr-ink:#FFFFFF; --hdr-chip:rgba(255,255,255,.14); --hdr-line:rgba(255,255,255,.28);
  --accent:#0A6A8A; --accent-ink:#FFFFFF; --accent-soft:#DDF0F6;
  --arm-a:#FFB547; --arm-b:#7FE0D0;
  --g0:#2F7A4E; --g1:#B8860B; --g2:#D0661A; --g3:#C1362A; --g4:#7B1E5A;
  --g0-soft:#E1F1E7; --g1-soft:#FBF1D6; --g2-soft:#FCE6D4; --g3-soft:#F8DCD8; --g4-soft:#F1DAE8;
  --warn:#8A5A00; --warn-soft:#FFF4D6; --new:#5B3FA8; --new-soft:#ECE7FA;
  --t-rose:#C2415A; --t-rose-s:#FBE6EA; --t-violet:#6A4BC4; --t-violet-s:#EEE8FB; --t-teal:#0B7A8C; --t-teal-s:#DDF2F4;
  --t-amber:#A86A0C; --t-amber-s:#FBF0DA; --t-blue:#2F66B0; --t-blue-s:#E2ECF9; --t-green:#2E7A52; --t-green-s:#E1F2E8; --t-slate:#4A5B68; --t-slate-s:#E8EDF1;
  --shadow:0 1px 2px rgba(18,32,42,.05),0 4px 14px rgba(18,32,42,.06);
  --shadow-lg:0 2px 4px rgba(18,32,42,.06),0 12px 28px rgba(11,79,105,.14);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1318; --surface:#141F27; --surface-2:#1A2731; --ink:#E4ECF1; --muted:#97A8B4; --line:#263844;
  --hdr:#0C2A38; --hdr-2:#12394B; --hdr-ink:#EAF4F8; --hdr-chip:rgba(255,255,255,.08); --hdr-line:rgba(255,255,255,.18);
  --accent:#5DB7D8; --accent-ink:#06222E; --accent-soft:#163744;
  --g0:#5CC08A; --g1:#E3B83E; --g2:#F0914A; --g3:#F06B5C; --g4:#D77DB6;
  --g0-soft:#173327; --g1-soft:#352D12; --g2-soft:#3A2414; --g3-soft:#3D1C19; --g4-soft:#361A2C;
  --warn:#EFC063; --warn-soft:#33290F; --new:#B7A4F0; --new-soft:#261F3D;
  --t-rose:#F08BA0; --t-rose-s:#3A1D25; --t-violet:#B9A5F2; --t-violet-s:#2A2244; --t-teal:#6DD3DF; --t-teal-s:#123238;
  --t-amber:#F2C66B; --t-amber-s:#33290F; --t-blue:#8DB6F0; --t-blue-s:#172A42; --t-green:#7DD3A3; --t-green-s:#15301F; --t-slate:#B3C2CC; --t-slate-s:#22303A;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1318; --surface:#141F27; --surface-2:#1A2731; --ink:#E4ECF1; --muted:#97A8B4; --line:#263844;
  --hdr:#0C2A38; --hdr-2:#12394B; --hdr-ink:#EAF4F8; --hdr-chip:rgba(255,255,255,.08); --hdr-line:rgba(255,255,255,.18);
  --accent:#5DB7D8; --accent-ink:#06222E; --accent-soft:#163744;
  --g0:#5CC08A; --g1:#E3B83E; --g2:#F0914A; --g3:#F06B5C; --g4:#D77DB6;
  --g0-soft:#173327; --g1-soft:#352D12; --g2-soft:#3A2414; --g3-soft:#3D1C19; --g4-soft:#361A2C;
  --warn:#EFC063; --warn-soft:#33290F; --new:#B7A4F0; --new-soft:#261F3D;
  --t-rose:#F08BA0; --t-rose-s:#3A1D25; --t-violet:#B9A5F2; --t-violet-s:#2A2244; --t-teal:#6DD3DF; --t-teal-s:#123238;
  --t-amber:#F2C66B; --t-amber-s:#33290F; --t-blue:#8DB6F0; --t-blue-s:#172A42; --t-green:#7DD3A3; --t-green-s:#15301F; --t-slate:#B3C2CC; --t-slate-s:#22303A;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;flex:none}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr);color:var(--hdr-ink)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:58px}
.back{display:inline-flex;align-items:center;gap:2px;background:var(--hdr-chip);border:0;color:inherit;font-weight:700;padding:8px 12px 8px 6px;border-radius:999px;cursor:pointer;min-height:40px;flex:none}
.back svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-size:25px;font-weight:700;letter-spacing:.05em}
.top h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.home-btn{display:inline-flex;align-items:center;gap:6px;background:var(--hdr-chip);border:1px solid var(--hdr-line);border-radius:999px;color:inherit;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;flex:none}
.home-btn svg{width:18px;height:18px}

/* Home band */
.band{background:linear-gradient(180deg,var(--hdr) 0%,var(--hdr-2) 100%);color:var(--hdr-ink);position:relative;overflow:hidden}
.band-in{max-width:980px;margin:0 auto;padding:6px 16px 76px;display:flex;flex-direction:column;gap:12px;position:relative}
.band h1{font-size:clamp(30px,7vw,44px);line-height:1.02;max-width:14ch}
.band p.lead{opacity:.88;max-width:40ch;font-size:15.5px}
.band .mark{position:absolute;right:-34px;top:40px;width:150px;height:150px;opacity:.14;pointer-events:none}
.band h1,.band p.lead,.ctx-pills{position:relative;z-index:1}
@media (min-width:700px){.band .mark{right:24px;width:230px;height:230px;opacity:.3}}
.ctx-pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctx-pills .p{display:inline-flex;align-items:center;gap:6px;background:var(--hdr-chip);border:1px solid var(--hdr-line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;min-height:34px}
.ctx-pills .p.dim{font-weight:400;opacity:.8}
.ctx-pills button.p{cursor:pointer;color:inherit}
.ctx-pills button.p svg{width:16px;height:16px}

/* Context strip (inner pages) */
.ctx{background:var(--surface);border-bottom:1px solid var(--line)}
.ctx-in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-weight:700;min-height:32px}
.chip.muted{font-weight:400;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 4px;min-height:32px;text-decoration:underline;text-underline-offset:3px}

main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.narrow{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lift{margin-top:-80px;position:relative}

/* Home action cards */
.hero-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;background:var(--surface);color:var(--ink);min-height:168px;box-shadow:var(--shadow-lg);transition:transform .12s ease}
.hero:hover{transform:translateY(-2px)}
.hero .disc{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--soft);color:var(--fg)}
.hero .disc svg{width:30px;height:30px}
.hero .lbl{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.hero .sub{font-size:13.5px;color:var(--muted);line-height:1.3}
.hero .go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--fg);font-size:14px}
.hero .go svg{width:16px;height:16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.section-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:124px;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--fg);transform:translateY(-1px)}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--fg);flex:none}
.ico svg{width:24px;height:24px}
.tile .lbl{font-weight:700;font-size:15.5px;line-height:1.2}
.tile .sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.c-rose{--fg:var(--t-rose);--soft:var(--t-rose-s)} .c-violet{--fg:var(--t-violet);--soft:var(--t-violet-s)} .c-teal{--fg:var(--t-teal);--soft:var(--t-teal-s)}
.c-amber{--fg:var(--t-amber);--soft:var(--t-amber-s)} .c-blue{--fg:var(--t-blue);--soft:var(--t-blue-s)} .c-green{--fg:var(--t-green);--soft:var(--t-green-s)} .c-slate{--fg:var(--t-slate);--soft:var(--t-slate-s)}
.patient-cta{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--t-rose);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow);width:100%}
.patient-cta .t{flex:1;min-width:0}
.patient-cta b{display:block;font-size:17px}
.patient-cta small{color:var(--muted);font-size:13.5px}
.patient-cta .chev{color:var(--t-rose)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:23px}
.card h3{font-size:18px;color:var(--accent)}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.card li::marker{color:var(--muted)}
.card li,.callout li,.wallet li,.signs li{overflow-wrap:anywhere}
.note{font-size:14px;color:var(--muted)}
.callout{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.callout .h{font-weight:700;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.callout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.c-agent{background:var(--accent-soft);border:1px solid var(--accent)} .c-agent .h{color:var(--accent)}
.c-warn{background:var(--warn-soft);border:1px solid var(--warn)} .c-warn .h{color:var(--warn)}
.c-new{background:var(--new-soft);border:1px solid var(--new)} .c-new .h{color:var(--new)}
.c-stop{background:var(--g3-soft);border:1px solid var(--g3)} .c-stop .h{color:var(--g3)}
.dose{font-family:var(--f-mono);font-weight:700;font-size:.9em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.calc{font-family:var(--f-mono);font-weight:700;color:var(--accent);white-space:nowrap}

/* Choice groups */
.q{display:flex;flex-direction:column;gap:8px}
.q-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.q-title b{font-size:17px}
.q-title span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer;width:100%}
.opt .g{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--surface-2);color:var(--muted)}
.opt .t{font-weight:700;line-height:1.25}
.opt .t small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .g{background:var(--accent);color:var(--accent-ink)}

/* Segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:700;cursor:pointer;min-height:44px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.gradepick button{font-family:var(--f-display);font-size:18px}
.gradepick button[aria-pressed="true"]{color:var(--surface)}
.gradepick button[data-g="1"][aria-pressed="true"]{background:var(--g1)}
.gradepick button[data-g="2"][aria-pressed="true"]{background:var(--g2)}
.gradepick button[data-g="3"][aria-pressed="true"]{background:var(--g3)}
.gradepick button[data-g="4"][aria-pressed="true"]{background:var(--g4)}
@media (max-width:480px){.gw{display:none}}

/* Result band */
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;border:2px solid var(--g);background:var(--gs);box-shadow:var(--shadow-lg)}
.result .num{flex:none;width:64px;height:64px;border-radius:14px;background:var(--g);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.result .num.sm{font-size:22px}
.result .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.result .txt b{font-family:var(--f-display);font-size:25px;line-height:1.05}
.result .txt span{font-size:13.5px;color:var(--ink)}
.result .go{flex:none;border:0;background:var(--g);color:var(--surface);font-weight:700;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
@media (max-width:420px){.result{flex-wrap:wrap}.result .go{width:100%}}
.gc0{--g:var(--g0);--gs:var(--g0-soft)} .gc1{--g:var(--g1);--gs:var(--g1-soft)} .gc2{--g:var(--g2);--gs:var(--g2-soft)} .gc3{--g:var(--g3);--gs:var(--g3-soft)} .gc4{--g:var(--g4);--gs:var(--g4-soft)}

/* ICE */
.ice-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.ice-grid{grid-template-columns:1fr 1fr}}
.ice-item{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;min-height:52px;width:100%}
.ice-item .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--g0);display:grid;place-items:center;background:var(--g0);color:var(--surface)}
.ice-item .box svg{width:18px;height:18px}
.ice-item[aria-pressed="false"]{border-color:var(--g3);background:var(--g3-soft)}
.ice-item[aria-pressed="false"] .box{background:var(--surface);border-color:var(--g3);color:var(--g3)}
.ice-item .t{flex:1;font-weight:700}
.ice-item .pts{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ice-score{font-family:var(--f-display);font-size:34px;font-weight:700}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* Agents */
.agent-list{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.agent-list{grid-template-columns:1fr 1fr}}
.agent-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;min-height:64px;width:100%;box-shadow:var(--shadow)}
.agent-row:hover{border-color:var(--accent)}
.agent-row .tg{flex:none;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px;min-width:70px;text-align:center}
.agent-row .nm{flex:1;min-width:0}
.agent-row .nm b{display:block}
.agent-row .nm small{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid currentColor}
.pill.rems{color:var(--g3)} .pill.new{color:var(--new)} .pill.upd{color:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.kv div:nth-child(odd){background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:700}
.kv div:nth-last-child(-n+2){border-bottom:0}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
select,input[type="number"],input[type="tel"],input[type="text"]{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface);color:var(--ink);min-height:40px;font-size:14px;font-weight:700}
.check[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:12px 16px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.dose-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.dose-grid{grid-template-columns:1fr 1fr}}
.drug{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.drug .dn{font-weight:700}
.drug .dv{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--accent)}
.drug .dd{font-size:13.5px;color:var(--muted)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* Patient card */
.wallet{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.wallet .strip{background:linear-gradient(120deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:14px 16px;display:flex;align-items:center;gap:12px}
.wallet .strip svg{width:36px;height:36px;flex:none}
.wallet .strip b{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;line-height:1.05;display:block}
.wallet .strip small{opacity:.85;font-size:13px}
.wallet .body{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:16.5px}
.wallet .big{font-size:19px;font-weight:700;line-height:1.3}
.wallet .row2{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.wallet .row2{grid-template-columns:1fr 1fr}}
.wallet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.wallet .staff{border-top:1px dashed var(--line);padding-top:12px;font-size:14.5px;color:var(--muted)}
.wallet .staff b{color:var(--ink)}
.signs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.signs li{display:flex;gap:12px;align-items:flex-start;font-size:16.5px;line-height:1.35}
.signs li .ico{width:38px;height:38px;border-radius:11px}
.signs li .ico svg{width:21px;height:21px}
.signs li b{display:block}
.urgent{border:2px solid var(--g3);background:var(--g3-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.urgent h2{color:var(--g3);font-size:25px;display:flex;align-items:center;gap:8px}
.urgent h2 svg{width:26px;height:26px}
.urgent ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:16.5px}

.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.credit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.credit .mono-av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--hdr);color:var(--hdr-ink);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em}
.credit b{display:block;font-size:16px}
.credit small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.byline{font-weight:700;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.hero,.tile{transition:none}}

.signs li .note{display:block;font-size:14.5px;margin-top:1px}
</style>

   3:["Hold BsAb, <b>including blinatumomab</b>, until symptoms resolve.","ICU level of care recommended.","Continue "+D("dexAMETHasone 10 mg IV q6h")+"; do not taper until Grade 1.","ICE every 4 h while ICE <10.","Consider "+anak()+", or "+D("anakinra 100 mg SC/IV q12h")+".","Persistent Grade 3: consider MRI brain every 2–3 days and/or daily EEG."],
   4:["Consider discontinuing BsAb, including blinatumomab.","Consider intubation for airway protection as indicated.","Consider "+D("dexAMETHasone 20 mg IV q6h")+" or "+D("methylPREDNISolone 1000 mg IV daily")+", then taper when Grade 1.","ICE every 4 h while ICE <10.","Consider "+anak()+", or "+D("anakinra 100 mg IV/SC q12h")+". Refractory to high-dose methylprednisolone and anakinra → consider "+silt()+".","Status epilepticus, life-threatening seizure, cerebral edema or papilledema → <button class=\"linkbtn\" data-go=\"seizure\">Seizure & ICP</button>"]
  }[g];
  h+='<div class="card gc'+g+'" style="border-color:var(--g);border-width:2px"><h2 style="color:var(--g)">ICANS Grade '+g+'</h2>'+ul(T)+'<p class="note">After resolution, check the agent’s PI for subsequent doses or discontinuation.</p></div>';
  h+='<div class="card"><h2>DexAMETHasone taper</h2><p class="note">Start once ICANS is Grade ≤1. Each step lasts 24 h.</p><div class="tbl-wrap"><table><thead><tr><th>Dose</th><th>Duration</th><th>ICANS grade</th></tr></thead><tbody>'+
   '<tr><td>MethylPREDNISolone 1000 mg (if used)</td><td class="mono">24 h</td><td>1</td></tr><tr><td>DexAMETHasone 10 mg q6h</td><td class="mono">24 h</td><td>1</td></tr><tr><td>DexAMETHasone 10 mg q8h</td><td class="mono">24 h</td><td>1</td></tr><tr><td>DexAMETHasone 10 mg q12h</td><td class="mono">24 h</td><td>1</td></tr><tr><td><b>Stop</b></td><td>—</td><td>≤1</td></tr></tbody></table></div></div>';
  h+=foot("Institutional BsAb guideline — ICANS management and dexamethasone taper.");return h+'</div>';
}

function vSeizure(){

  '<div class="card" style="border-color:var(--g4);border-width:2px"><h2 style="color:var(--g4)">Status epilepticus / life-threatening seizure</h2><ol class="steps"><li>Assess CAB, airway, O₂ and glucose. <b>Escalate to ICU.</b></li><li>'+D("LORazepam 2 mg IV")+' once, then another 2 mg after ≥1 min (total 4 mg).</li><li>'+D("levETIRAcetam 500 mg IV")+' in addition to maintenance. Seizures continue → ICU and add another agent, e.g. '+D("PHENobarbital 15 mg/kg IV load")+pb+'.</li><li>Refractory → continuous EEG monitoring.</li></ol><h3>Maintenance after resolution</h3>'+ul([D("LORazepam 0.5 mg IV q8h × 3 doses"),D("levETIRAcetam 1000 mg IV q12h"),D("PHENobarbital 1–3 mg/kg IV q12h")+pbm])+'</div>'+
  '<div class="card"><h2>Raised ICP / cerebral edema</h2><h3>Stage 1–2 papilledema with CSF opening pressure &lt;20 mmHg, no cerebral edema</h3>'+ul([D("acetaZOLAMIDE 1000 mg IV")+", then "+D("250–1000 mg IV q12h")+". Monitor renal function and acid–base q12h."])+
  '<h3>Stage 3–5 papilledema, any cerebral edema on imaging, or opening pressure ≥20 mmHg</h3>'+ul(["High-dose steroids per Grade 4 ICANS.","Head of bed at 30°.","Hyperventilate to PaCO₂ 28–30 mmHg for no more than 24 h.","Hyperosmolar therapy: mannitol or hypertonic saline (3% or 23.4%).","Ommaya reservoir → drain CSF to opening pressure <20 mmHg.","Consider neurosurgery consult. IV anesthetics for burst suppression on EEG.","CMP q6h, daily CT head; adjust for rebound edema, renal failure, electrolytes, hypovolemia, hypotension."])+'</div>'+foot("Institutional BsAb guideline — seizure and raised ICP management.")+'</div>';
}

function vDose(){

function vWorkup(){

  '<div class="card"><h2>Differential diagnosis</h2>'+ul(["Sepsis / neutropenic fever — can be indistinguishable from CRS; treat both in parallel per institutional protocol.","Viral or opportunistic infection (COVID-19, CMV, PJP).","Infusion reaction (IV agents).","Tumor flare (glofitamab ≈12%).","PML — subacute focal deficits (epcoritamab, glofitamab, linvoseltamab).","Headache and neuropathy are common and are not ICANS."])+'</div>'+

  callout("c-new","Beyond the source guideline (ASTCT, Hines 2023)",["First-line: anakinra ± corticosteroids. Avoid tocilizumab unless CRS is also present.","Rare after bispecifics (≈0.7%) but high mortality. Involve Hematology early."])+'</div>'+foot("Institutional BsAb guideline; Hines et al. 2023; Crombie et al. 2024.")+'</div>';

function vMonitor(){

  callout("c-new","Recent label changes that shift CRS to home",["Tarlatamab (Sep 2026): 6–8 h observation, caregiver + within 1 h for 48 h, vitals Day 2 and 9.","Epcoritamab (Apr 2026): outpatient first full dose allowed at clinician discretion.","Mosunetuzumab SC: CRS after C1D8 median onset 62 h — monitor ≈72–96 h."])+'</div>'+
  '<div class="card"><h2>Escalation</h2>'+ul(["Notify the Heme/Onc attending when care is escalated after the emergency response team, and <b>before</b> tocilizumab, anakinra, siltuximab or corticosteroids.","Infusion center → ED/inpatient: use your institution’s transfer handoff process."])+'</div>'+foot("Institutional BsAb guideline — assessment, monitoring and home-monitoring plan.")+'</div>';

function vED(){
  var opts='<option value="">Bispecific antibody (name not set)</option>'+AGENTS.map(function(a){return '<option value="'+a.id+'"'+(S.agent===a.id?" selected":"")+'>'+a.name+' ('+a.brand+')</option>';}).join("");
  function sign(cls,icon,t,s){return '<li class="'+cls+'"><span class="ico">'+I(icon)+'</span><span><b>'+t+'</b>'+(s?'<span class="note">'+s+'</span>':'')+'</span></li>';}
  return '<div class="narrow"><p class="note">Show this screen to any nurse or doctor caring for you — in urgent care, the emergency room or a clinic.</p>'+
  '<div class="wallet"><div class="strip">'+AB()+'<div><b>BISPECIFIC ANTIBODY THERAPY</b><small>Patient alert card</small></div></div><div class="body">'+
   '<p class="big">I am being treated for cancer with a bispecific antibody (a T-cell engager).</p>'+
   '<div class="row2"><div class="field"><label for="w-agent">My medicine</label><select id="w-agent" data-ctx="agent">'+opts+'</select></div>'+
   '<div class="field"><label for="w-phone">My cancer team’s phone</label><input id="w-phone" type="tel" inputmode="tel" autocomplete="off" placeholder="Clinic or on-call number" value="'+esc(S.phone||"")+'" data-ctx="phone"></div></div>'+
   '<div><b>This medicine can cause:</b><ul><li><b>Cytokine release syndrome (CRS)</b> — fever, low blood pressure, low oxygen</li><li><b>Neurotoxicity (ICANS)</b> — confusion, trouble speaking or writing, sleepiness, seizures</li></ul></div>'+
   '<div class="staff"><b>For healthcare staff:</b> treat fever, hypotension, hypoxia or new confusion as possible CRS or ICANS, and evaluate for infection at the same time. Contact the patient’s cancer team early; treatment may include tocilizumab and/or dexamethasone. <button class="linkbtn" data-go="crs">Grade CRS</button> <button class="linkbtn" data-go="ice">ICE score</button></div>'+
  '</div></div>'+
  '<div class="card"><h2>Call your cancer team right away if you have</h2><ul class="signs">'+
   sign("c-rose",IC.thermo,"A temperature of 100.4 °F (38 °C) or higher","or shaking chills")+
   sign("c-rose",IC.heart,"Dizziness, lightheadedness or a racing heartbeat","especially when you stand up")+
   sign("c-blue",IC.wind,"Shortness of breath","or an oxygen reading lower than your usual")+
   sign("c-violet",IC.brain,"Confusion, or trouble speaking, reading or writing","unusual sleepiness, shaking or tremor")+
   sign("c-amber",IC.alert,"A severe headache, or feeling very unwell","")+
  '</ul></div>'+
  '<div class="urgent"><h2>'+I(IC.alert)+'Call 911 or go to the nearest ER if</h2><ul><li>You have trouble breathing</li><li>You faint or cannot stay awake</li><li>You have a seizure</li><li>Confusion is getting worse quickly</li></ul><p>Bring this card (or your wallet card) and tell staff you receive a bispecific antibody.</p></div>'+

   sign("c-teal",IC.clock,"Check your temperature, blood pressure and oxygen every 4–8 hours","for at least 48 hours after each step-up dose, or as your team tells you. Write the numbers down.")+
   sign("c-green",IC.users,"Have a caregiver with you","and stay close to your treatment center during the high-risk days.")+
   sign("c-amber",IC.car,"Do not drive or use heavy machinery","for 48 hours after each step-up dose, or while you have any symptoms.")+
   sign("c-slate",IC.pill,"Take “if needed” medicines only when your team says so","fever reducers and steroids can hide a fever — call first.")+
  '</ul></div>'+foot("Patient guidance adapted from the institutional BsAb guideline and product labels.")+'</div>';
}

function vOther(){
  return '<div class="narrow">'+callout("c-new","Beyond the CRS/ICANS guideline",["The source guideline covers CRS and ICANS only. The items below summarize current labels and consensus (IMWG 2024, Crombie 2024). Follow your service’s infection protocol."])+
  '<div class="card"><h2>Infections</h2><p>The leading cause of non-relapse death with myeloma bispecifics (fatal infections ≈4–7% with BCMA agents).</p>'+ul(["HSV/VZV prophylaxis: acyclovir or valacyclovir.","PJP prophylaxis (TMP-SMX); required by the epcoritamab label.","IVIG to keep IgG >400 mg/dL (myeloma; now in Tecvayli label).","CMV PCR monitoring; HBV prophylaxis (entecavir) if at risk.","Vaccinate before starting where possible.","New focal neuro deficits over weeks → consider PML."])+'</div>'+

  '<div class="card"><h2>Talquetamab (GPRC5D)</h2>'+ul(["Oral toxicity ≈80% (dysgeusia, dry mouth, dysphagia) — often persistent.","Skin ≈62%, nails ≈50%, weight loss ≈62%.","Label: Grade 3 → withhold until ≤Grade 1; Grade 4 → discontinue.","Emollients, topical steroids, SLS-free toothpaste, dietitian, dental review; consider less frequent dosing."])+'</div>'+

/* ---------- Events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.go){go(d.go);return;}
  if(d.crs){CRS[d.crs]=d.crs==="fever"?d.val:parseInt(d.val,10);render();return;}
  if(d.ice){if(NEU.loc===4)return;ICE[d.ice]=!ICE[d.ice];render();return;}
  if(d.neu){NEU[d.neu]=parseInt(d.val,10);render();return;}
  if(d.mg){if(d.mg==="crs"){ui.crsGrade=parseInt(d.g,10);go("crsm");}else{ui.icansGrade=parseInt(d.g,10);go("icansm");}return;}
  if(d.pickg){if(d.pickg==="crs")ui.crsGrade=parseInt(d.g,10);else ui.icansGrade=parseInt(d.g,10);render();return;}
  if(d.set){S[d.set]=d.val;save();render();return;}
  if(d.tog){S[d.tog]=!S[d.tog];save();render();return;}
  if(d.setagent){S.agent=d.setagent;save();render();return;}
  if(d.act==="resetcrs"){CRS={fever:"yes",bp:0,o2:0};render();return;}
  if(d.act==="resetice"){for(var k in ICE)ICE[k]=true;NEU={loc:0,sz:0,motor:0,icp:0};render();return;}
  if(d.act==="clearctx"){S=JSON.parse(JSON.stringify(DEF));save();render();return;}
  if(d.themeSet){if(d.themeSet==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",d.themeSet);try{localStorage.setItem("bsabtox.theme",d.themeSet);}catch(x){}return;}
});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.ctx==="agent"){S.agent=t.value;save();renderCtx(route());}});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.ctx==="phone"){S.phone=t.value.slice(0,40);save();return;}if(t.dataset&&t.dataset.ctx==="wt"){S.wt=t.value;save();renderCtx(route());
  var lb=document.getElementById("c-lb");if(lb)lb.textContent=wt()?"≈ "+r(wt()*2.2046)+" lb":"";
  var dg=document.getElementById("dosegrid");if(dg){dg.innerHTML=doseCards();var n=t.closest(".card").querySelector(".note");if(n)n.textContent=wt()?"≈ "+r(wt()*2.2046)+" lb. Doses below are calculated for "+wt()+" kg.":"Enter a weight to calculate weight-based doses.";}}});
try{var th=localStorage.getItem("bsabtox.theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th);}catch(e){}
render();
